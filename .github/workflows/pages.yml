name: Deploy GitHub Pages — طرح کسب‌وکار تعاملی اورژانس خودرو (EMSCar)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Validate & Upload 26-Slide Pitch Deck Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub Pages static deck, modules, fonts & assets
        run: |
          test -f site/.nojekyll
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          test -f site/data/slides.js
          test -f site/data/financial-model.js
          test -f site/components/charts.js
          test -f site/404.html
          test -s site/assets/favicon.svg
          test -s site/assets/fonts/Vazirmatn-VF.woff2
          test -s site/assets/hero-qazvin-dispatch.jpg
          test -s site/assets/step1-mobile-sos.jpg
          test -s site/assets/step2-control-center.jpg
          test -s site/assets/step3-onsite-diagnostics.jpg
          test -s site/assets/step4-flatbed-tow.jpg
          test -s site/assets/step5-ev-specialist.jpg
          test -s site/assets/step6-payment-invoice.jpg
          node --check site/app.js
          node --check site/data/slides.js
          node --check site/data/financial-model.js
          node --check site/components/charts.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    name: Publish to GitHub Pages (https://rahmaniho.github.io/EMSCar/)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
